name: Complete niche research v3

on:
  push:
    paths:
      - '.github/workflows/complete-top10-niche-v3.yml'

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Ensure top ten retrofit is applied
        run: python3 technical/automation/_tmp_complete_top10_niche_v3.py
      - name: Validate and reconcile all niche dossiers
        run: python3 technical/automation/_tmp_reconcile_niche_v3.py
      - name: Commit canonical reconciliation
        run: |
          git config user.name 'DRF Research Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add research/niches businesses/NICHES.md
          if git diff --cached --quiet; then
            echo 'No changes required'
          else
            git commit -m 'Complete and reconcile all 31 niche research dossiers v3'
            git push
          fi
