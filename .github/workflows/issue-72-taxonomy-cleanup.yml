name: Issue 72 Business Blueprints taxonomy cleanup

on:
  push:
    branches:
      - issue-72-blueprint-taxonomy-cleanup
    paths:
      - .github/workflows/issue-72-taxonomy-cleanup.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: issue-72-blueprint-taxonomy-cleanup
          fetch-depth: 0

      - name: Collapse duplicate website parent into Business Blueprints
        shell: python
        run: |
          from pathlib import Path
          import re
          import shutil

          def read(path):
              return Path(path).read_text()

          def write(path, text):
              p = Path(path)
              p.parent.mkdir(parents=True, exist_ok=True)
              p.write_text(text)

          def replace_once(path, old, new):
              s = read(path)
              if old not in s:
                  raise SystemExit(f'Expected text not found in {path}: {old[:120]}')
              write(path, s.replace(old, new, 1))

          def replace_regex(path, pattern, repl):
              s = read(path)
              s2, count = re.subn(pattern, repl, s, count=1, flags=re.S)
              if count != 1:
                  raise SystemExit(f'Expected one regex match in {path}, found {count}: {pattern}')
              write(path, s2)

          # ------------------------------------------------------------------
          # 1. Canonical Business Blueprints product taxonomy
          # ------------------------------------------------------------------
          product_types = '''# Business Blueprints — Product Types

**Status:** Canonical product-format taxonomy  
**Parent opportunity:** **Business Blueprints**  
**Issue:** #72  
**Rule:** **A product type is not a parent business opportunity.**

## Read this first

DRF has one parent opportunity for packaged digital business IP:

> **Business Blueprints**

A Blueprint can be delivered in several product formats. The file format, builder, marketplace or storefront does **not** create a new parent business.

```text
PROVEN OUTCOME × NICHE
        ↓
BUSINESS BLUEPRINT
        ↓
choose the best product format(s)
        ↓
choose compatible distribution channels
        ↓
sell / deploy / measure
```

## Product types

| Product type | What the buyer receives | Typical specialist channels | Parent opportunity |
|---|---|---|---|
| **Complete operating-business Blueprint** | Playbook, SOPs, pricing, scripts, workflows, templates, implementation instructions and proof boundaries | Whop plus general digital-product storefronts | **Business Blueprints** |
| **Website + revenue launch kit** | Reusable site/landing assets plus lead capture, CRM/quote/booking flow, tracking and deployment instructions | Framer, Webflow plus general digital-product storefronts | **Business Blueprints** |
| **Notion / database operating system** | Databases, dashboards, CRM/project/recruitment workflows and operating instructions | Notion Marketplace plus general storefronts | **Business Blueprints** |
| **Workflow / automation pack** | Automations, recipes, configuration, SOPs and implementation instructions | Whop, Gumroad, Contra and compatible specialist channels | **Business Blueprints** |
| **Prompt / agent / Skill pack** | Prompts, agent instructions, Skills and workflow components | PromptBase, Whop, Gumroad, Contra where policy fit allows | **Business Blueprints** |
| **Software / licence / API component** | Reusable software, licence, app or API capability that forms part of the operating system | Lemon Squeezy, Shopify, GitHub Marketplace, RapidAPI where applicable | **Business Blueprints** |
| **Playbook / guide / checklist bundle** | Documented operating knowledge and deployment assets | Gumroad, Payhip, Whop, Contra and owned storefronts | **Business Blueprints** |

A single Blueprint can contain more than one product type.

## Qualification rule

An asset becomes a Business Blueprint SKU only when it has:

1. a clearly defined underlying **Outcome × Niche**;
2. evidence that the operating logic is useful, not generic filler;
3. a repeatable core that can be reused without rebuilding from zero;
4. explicit setup, inputs, boundaries and failure modes;
5. rights-safe assets and channel-compatible packaging;
6. a measurable buyer outcome or deployment objective;
7. a version-controlled canonical source.

The packaged product still needs its own buyer-demand test. Proof that a service works does not automatically prove that strangers will buy the digital product.

## Naming rule

Do **not** create a parent opportunity named after:

- a website builder;
- a template format;
- a marketplace;
- a storefront;
- a CRM;
- an AI model;
- a file type.

Those belong downstream as **product format, delivery rail or distribution channel**.

## Website / launch-kit treatment

Website and launch-kit assets are one product type inside Business Blueprints. They are useful when a proven business system naturally needs a conversion-ready digital front end, but they are not independently ranked as another DRF parent business.

See [`product-types/website-and-launch-kits.md`](./product-types/website-and-launch-kits.md).

## Distribution

Product type determines which specialist marketplaces are compatible, but general distribution still follows:

[`DISTRIBUTION-CHANNELS.md`](./DISTRIBUTION-CHANNELS.md)
'''
          write('businesses/business-blueprints/PRODUCT-TYPES.md', product_types)

          website_type = '''# Product Type — Website & Revenue Launch Kits

**Status:** Supporting Business Blueprint product type — **not a separate parent opportunity**  
**Parent:** [`Business Blueprints`](../README.md)  
**Taxonomy corrected:** 31 August 2026 — Issue #72

## What this is

A website / revenue launch kit is one possible **Business Blueprint SKU format**.

The valuable asset is not “an AI website”. The valuable asset is a reusable, proof-backed commercial deployment package that may include:

- niche-specific page structure;
- service/offer catalogue;
- conversion copy framework;
- landing pages;
- WhatsApp, phone or form capture;
- CRM/pipeline configuration;
- booking or quote workflow;
- tracking and attribution;
- review/reputation hooks;
- automation recipes;
- implementation instructions;
- optional localisation variants.

## Why it belongs inside Business Blueprints

The earlier DRF research established two important facts:

1. generic AI-assisted website production is heavily commoditised and is not a strong standalone moat;
2. specialist template marketplaces can still provide attractive distribution economics when the asset is a genuinely useful, reusable vertical system.

Therefore the website/template is a **component and product format**. The parent commercial logic remains:

```text
prove Outcome × Niche
→ package reusable operating IP
→ include website/launch assets when useful
→ distribute the Blueprint through compatible channels
→ offer optional iMPLEMENTAi implementation/customisation
→ measure contribution and buyer activation
```

## Product gate

A website/launch-kit SKU should not be published merely because AI can generate it quickly.

Require:

- a proven or strongly underwritten underlying business/result;
- at least **80% core asset reuse** across repeated deployments where client proof is used;
- bounded customisation and revision rules;
- a clear lead/quote/booking/revenue path;
- measurable deployment or conversion objective;
- channel-compliant rights and original assets;
- a self-deployment path or clearly priced optional implementation service.

## Channel fit

| Channel type | Role |
|---|---|
| **Framer Marketplace** | Specialist distribution when the Blueprint contains a Framer-native site/template. |
| **Webflow Templates** | Specialist distribution when the Blueprint contains a Webflow-native site/template. |
| **Whop** | Full Business Blueprint / operating-business package where appropriate. |
| **Gumroad / Payhip** | General packaged files, guides, ZIP assets and implementation materials. |
| **Contra** | Product + optional implementation/customisation bridge. |
| **Shopify / Lemon Squeezy** | Owned checkout, bundles, licences or recurring digital components where appropriate. |

Do not force the SKU onto a specialist website marketplace if no native website asset exists.

## Historical evidence retained

The pre-consolidation research found that:

- very low-cost AI website builders weaken willingness to pay for generic site creation;
- Framer and Webflow creator economics can make specialist template distribution attractive;
- the stronger commercial asset is a niche-specific conversion system rather than a brochure website;
- implementation/customisation can remain an optional iMPLEMENTAi revenue stream without becoming a separate DRF parent opportunity.

The detailed pre-consolidation wording remains available through Git history. Current DRF truth is this file plus the parent Business Blueprints documents.

## Score treatment

There is **no separate opportunity score or RBS** for this product type.

Its economics are evaluated inside:

1. the underlying Outcome × Niche proof;
2. the parent **Business Blueprints** RBF;
3. the relevant channel economics.
'''
          write('businesses/business-blueprints/product-types/website-and-launch-kits.md', website_type)

          # ------------------------------------------------------------------
          # 2. Business Blueprints README: one parent, product types downstream
          # ------------------------------------------------------------------
          replace_regex(
              'businesses/business-blueprints/README.md',
              r'\n## Connection to AI Website Template & Launch Kit Factory\n.*?\n## First Blueprint candidates from existing DRF evidence\n',
              '''\n## Product types — one business, many SKUs\n\nBusiness Blueprints can be packaged as complete operating-business bundles, website/revenue launch kits, Notion systems, workflow/automation packs, prompt/agent/Skill packs, software/API components, or playbook bundles.\n\n**These are product formats, not separate parent opportunities.**\n\nA website/launch kit is therefore one possible Blueprint SKU when the underlying Outcome × Niche is proven and the assets are genuinely reusable. It is not another business alongside Business Blueprints.\n\nSee:\n\n- [`PRODUCT-TYPES.md`](./PRODUCT-TYPES.md)\n- [`product-types/website-and-launch-kits.md`](./product-types/website-and-launch-kits.md)\n\n## First Blueprint candidates from existing DRF evidence\n'''
          )
          p = Path('businesses/business-blueprints/README.md')
          s = p.read_text()
          s = '\n'.join(line for line in s.splitlines() if 'Vertical Revenue Launch Kit' not in line) + '\n'
          s = s.replace('- [`DISTRIBUTION-CHANNELS.md`](./DISTRIBUTION-CHANNELS.md) — product-to-channel routing matrix', '- [`PRODUCT-TYPES.md`](./PRODUCT-TYPES.md) — product-format taxonomy; website/launch kits are one SKU type, not another parent business\n- [`DISTRIBUTION-CHANNELS.md`](./DISTRIBUTION-CHANNELS.md) — product-to-channel routing matrix')
          s = s.replace('**Issue:** #67', '**Issues:** #67, #72')
          p.write_text(s)

          # ------------------------------------------------------------------
          # 3. Parent research: remove the artificial business split
          # ------------------------------------------------------------------
          p = Path('businesses/business-blueprints/RESEARCH.md')
          s = p.read_text()
          s = '\n'.join(line for line in s.splitlines() if 'Vertical Revenue Launch Kit Blueprint' not in line) + '\n'
          pattern = r'\n## 7\. Connection to AI Website Template & Launch Kit Factory\n.*?\n## 9\. Parent RBF score implication\n'
          repl = '''\n## 7. Product types inside Business Blueprints\n\nA Blueprint can be packaged in several formats without creating a new parent opportunity.\n\nExamples include:\n\n- complete operating-business bundles;\n- website + revenue launch kits;\n- Notion/database operating systems;\n- workflow and automation packs;\n- prompt/agent/Skill packs;\n- software, licence or API components;\n- playbook/checklist bundles.\n\nThe website/launch-kit research is therefore retained as a **Business Blueprint product-type evidence module**, not a client-service business with a separate portfolio score.\n\nSee `PRODUCT-TYPES.md` and `product-types/website-and-launch-kits.md`.\n\n## 8. One business, multiple monetisation layers\n\nThe same Blueprint IP can create several revenue layers without becoming several parent opportunities:\n\n```text\nBusiness Blueprint sale\n+ optional bundle/licence/update revenue\n+ channel-specific royalty/referral upside\n+ optional iMPLEMENTAi implementation/customisation\n+ optional underlying service/software expansion\n```\n\nThese are revenue streams and delivery options of **Business Blueprints**. They should be measured separately, but they do not require a second parent business merely because one SKU contains a website or launch kit.\n\n## 9. Parent RBF score implication\n'''
          s2, count = re.subn(pattern, repl, s, count=1, flags=re.S)
          if count != 1:
              raise SystemExit(f'Failed to consolidate Business Blueprints RESEARCH sections: {count}')
          s = s2
          s = s.replace('- `../ai-website-template-launch-kit-factory/RESEARCH.md`', '- `PRODUCT-TYPES.md`\n- `product-types/website-and-launch-kits.md`')
          s = s.replace('**Issue:** #67', '**Issues:** #67, #72')
          p.write_text(s)

          # ------------------------------------------------------------------
          # 4. RBF: candidates are outcomes, not product formats
          # ------------------------------------------------------------------
          p = Path('businesses/business-blueprints/RBF-ASSESSMENT.md')
          s = p.read_text()
          s = '\n'.join(line for line in s.splitlines() if 'Vertical Revenue Launch Kit' not in line) + '\n'
          pattern = r'\n## 8\. Relationship to AI Website Template & Launch Kit Factory\n.*?\n## 9\. Whop as a channel\n'
          repl = '''\n## 8. Product types are downstream of the parent business\n\nA website/revenue launch kit is one possible **Business Blueprint product type**. It does not receive a second parent RBS.\n\nThe correct hierarchy is:\n\n```text\nunderlying Outcome × Niche proof\n→ Business Blueprints parent underwriting\n→ select product format(s)\n→ select compatible distribution channels\n→ measure buyer demand and contribution\n```\n\nWebsite, Notion, workflow, prompt/Skill, software/API and document bundles are packaging choices. Optional iMPLEMENTAi implementation/customisation is a revenue stream, not a reason to duplicate the parent opportunity.\n\nSee `PRODUCT-TYPES.md`.\n\n## 9. Whop as a channel\n'''
          s2, count = re.subn(pattern, repl, s, count=1, flags=re.S)
          if count != 1:
              raise SystemExit(f'Failed to consolidate RBF section: {count}')
          s = s2.replace('**Issue:** #67', '**Issues:** #67, #72')
          p.write_text(s)

          # ------------------------------------------------------------------
          # 5. Distribution: product type, not adjacent opportunity
          # ------------------------------------------------------------------
          replace_regex(
              'businesses/business-blueprints/DISTRIBUTION-CHANNELS.md',
              r'\n## Connection to Vertical Revenue Launch Kits\n.*\Z',
              '''\n## Website and launch kits as a product type\n\nA website/revenue launch kit is one **Business Blueprint SKU format**. If the Blueprint contains native Framer or Webflow assets, those specialist marketplaces can be added to the general channel portfolio.\n\nThis is a routing rule, not a second business opportunity:\n\n`proven Outcome × Niche → Business Blueprint → website/launch-kit product format when useful → compatible channels → optional implementation → more proof`\n\nSee [`PRODUCT-TYPES.md`](./PRODUCT-TYPES.md) and [`product-types/website-and-launch-kits.md`](./product-types/website-and-launch-kits.md).\n'''
          )
          p = Path('businesses/business-blueprints/DISTRIBUTION-CHANNELS.md')
          s = p.read_text().replace('**Issue:** #67', '**Issues:** #67, #72')
          p.write_text(s)

          # ------------------------------------------------------------------
          # 6. Canonical current portfolio: remove duplicate parent everywhere
          # ------------------------------------------------------------------
          p = Path('businesses/README.md')
          s = p.read_text()
          s = s.replace('## Legacy offer directory — latest targeted update 31 August 2026', '## Legacy offer directory — latest targeted update 31 August 2026 (Issue #72 taxonomy consolidation)')
          s = '\n'.join(line for line in s.splitlines() if 'AI Website Template & Launch Kit Factory' not in line and 'ai-website-template-launch-kit-factory' not in line) + '\n'
          marker = '## Legacy offer directory — latest targeted update 31 August 2026 (Issue #72 taxonomy consolidation)\n'
          s = s.replace(marker, marker + '\n**Current parent opportunity count: 27.** Website/launch-kit assets are a Business Blueprints product type, not a separate parent opportunity.\n')
          p.write_text(s)

          p = Path('businesses/INVESTMENT-READINESS.md')
          s = p.read_text()
          s = s.replace('**Version:** 1.3', '**Version:** 1.4')
          s = s.replace('**Latest targeted rebuild:** #67 — Business Blueprints generalised to multi-platform digital-product distribution', '**Latest targeted rebuild:** #72 — duplicate website-template parent absorbed into Business Blueprints product taxonomy')
          s = s.replace('Do not create 28 Issues before execution starts.', 'Do not create 27 Issues before execution starts.')
          s = '\n'.join(line for line in s.splitlines() if 'AI Website Template & Launch Kit Factory' not in line) + '\n'
          intro = 'For digital products, distribution is a separate downstream layer:\n'
          s = s.replace(intro, '**Current parent opportunity count: 27.** Website/launch-kit assets are downstream Business Blueprint product formats and are not separately ranked.\n\n' + intro)
          p.write_text(s)

          p = Path('businesses/OPPORTUNITIES.md')
          s = p.read_text()
          s = s.replace('**Latest targeted evidence update:** 31 August 2026 — Issue #67 (Business Blueprints multi-platform generalisation)', '**Latest targeted evidence update:** 31 August 2026 — Issue #72 (Business Blueprints taxonomy consolidation)')
          s = s.replace('**Research basis:** all 28 offer dossiers + all 31 canonical niche dossiers at Comprehensive v3, plus subsequent opportunity-specific evidence updates', '**Research basis:** 27 current parent-opportunity dossiers + all 31 canonical niche dossiers at Comprehensive v3, plus the absorbed website/launch-kit product-type evidence and subsequent opportunity-specific updates')
          s = s.replace('- The largest structural downgrades are **AI Job Board 84→76** and **AI Website Template Factory 79→71**. Cheap software/buildability does not solve the commercial bottleneck.', '- **Taxonomy correction:** the former standalone website/launch-kit thesis is absorbed into **Business Blueprints** as a product type and is no longer independently ranked. Its old 71/100 screen remains historical only. **AI Job Board 84→76** remains a material standalone downgrade.')
          s = s.replace('Research Completeness is **100% across all 28 parent opportunities**', 'Research Completeness is **100% across all 27 current parent opportunities**')
          s = '\n'.join(line for line in s.splitlines() if 'AI Website Template & Launch Kit Factory' not in line) + '\n'
          p.write_text(s)

          # ------------------------------------------------------------------
          # 7. Historical/current research mapping: make old thesis impossible
          #    to mistake for a current parent opportunity.
          # ------------------------------------------------------------------
          historical = [
              'research/five-golden-business-opportunities-2026-08-29.md',
              'research/opportunity-portfolio-rescore-after-niche-v3-2026-08-29.md',
              'research/opportunity-execution-velocity-and-staircase-2026-08-29.md',
          ]
          legacy_label = 'Business Blueprints — website/launch-kit product type (historical working thesis)'
          notice = '''\n> **Current taxonomy notice — 31 August 2026 / Issue #72:** Website/template/launch-kit assets are **not a standalone DRF parent opportunity**. They are a product type inside **Business Blueprints**. Any scores or rankings below that treat the website/launch-kit thesis separately are preserved only as historical research and must not be read as a current portfolio row.\n'''
          for path in historical:
              p = Path(path)
              s = p.read_text()
              s = s.replace('AI Website Template & Launch Kit Factory', legacy_label)
              s = s.replace('AI Website Template Factory', 'website/launch-kit product-type thesis')
              if 'Current taxonomy notice — 31 August 2026 / Issue #72' not in s:
                  first_break = s.find('\n\n')
                  if first_break == -1:
                      raise SystemExit(f'Could not insert taxonomy notice in {path}')
                  s = s[:first_break+2] + notice + s[first_break+2:]
              # Make the recommended execution wording current where present.
              s = s.replace('## Priority 3 — ' + legacy_label, '## Priority 3 — Business Blueprints productisation')
              s = s.replace('This is the cheapest near-autonomous product factory and can also produce acquisition assets for Priority 1.', 'Use the Business Blueprints productisation layer to package proven reusable assets; website/launch-kit files are only one possible SKU format.')
              p.write_text(s)

          # ------------------------------------------------------------------
          # 8. Remove duplicate parent folder from current tree.
          # Git history retains the original files.
          # ------------------------------------------------------------------
          old_dir = Path('businesses/ai-website-template-launch-kit-factory')
          if not old_dir.exists():
              raise SystemExit('Expected duplicate parent folder is missing')
          shutil.rmtree(old_dir)

          # ------------------------------------------------------------------
          # 9. Current-tree consistency assertions
          # ------------------------------------------------------------------
          forbidden_exact = [
              'AI Website Template & Launch Kit Factory',
              'ai-website-template-launch-kit-factory',
          ]
          current_docs = [
              Path('businesses/README.md'),
              Path('businesses/OPPORTUNITIES.md'),
              Path('businesses/INVESTMENT-READINESS.md'),
              Path('businesses/business-blueprints/README.md'),
              Path('businesses/business-blueprints/RESEARCH.md'),
              Path('businesses/business-blueprints/RBF-ASSESSMENT.md'),
              Path('businesses/business-blueprints/DISTRIBUTION-CHANNELS.md'),
              Path('businesses/business-blueprints/PRODUCT-TYPES.md'),
              Path('businesses/business-blueprints/product-types/website-and-launch-kits.md'),
          ]
          for path in current_docs:
              s = path.read_text()
              for term in forbidden_exact:
                  if term in s:
                      raise SystemExit(f'Forbidden legacy taxonomy remains in {path}: {term}')

          # Historical docs may describe the old study, but not under its old
          # standalone-opportunity name.
          for path in historical:
              s = Path(path).read_text()
              for term in forbidden_exact:
                  if term in s:
                      raise SystemExit(f'Legacy standalone name remains in historical mapping {path}: {term}')

          # Current parent tables must contain Business Blueprints once and no
          # website-template duplicate.
          if read('businesses/README.md').count('| **19** | **Business Blueprints**') != 1:
              raise SystemExit('Business Blueprints directory row missing/duplicated')
          if read('businesses/OPPORTUNITIES.md').count('| **Business Blueprints** | **Candidate** | **82/100**') != 1:
              raise SystemExit('Business Blueprints opportunity row missing/duplicated')
          if read('businesses/INVESTMENT-READINESS.md').count('| **1** | **Business Blueprints**') != 1:
              raise SystemExit('Business Blueprints investment row missing/duplicated')

      - name: Verify taxonomy and commit
        run: |
          test ! -d businesses/ai-website-template-launch-kit-factory
          grep -q '^# Business Blueprints — Product Types' businesses/business-blueprints/PRODUCT-TYPES.md
          grep -q 'not a separate parent opportunity' businesses/business-blueprints/product-types/website-and-launch-kits.md
          ! grep -R -n -F 'AI Website Template & Launch Kit Factory' businesses research
          ! grep -R -n -F 'ai-website-template-launch-kit-factory' businesses research
          git status --short
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Collapse website template thesis into Business Blueprints'
          git push origin HEAD:issue-72-blueprint-taxonomy-cleanup
