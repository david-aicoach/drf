name: DRF Project lifecycle

on:
  issues:
    types: [opened, labeled, assigned, closed, reopened]
  pull_request:
    types: [opened, reopened, ready_for_review, closed]
  push:
    branches:
      - 'issue-*'

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  inbox:
    if: github.event_name == 'issues' && github.event.action == 'opened'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/set-drf-project-status
        with:
          token: ${{ secrets.PROJECT_MANAGEMENT_TOKEN }}
          issue-number: ${{ github.event.issue.number }}
          target-status: Inbox

  research:
    if: github.event_name == 'issues' && github.event.action == 'labeled' && github.event.label.name == 'needs-research'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/set-drf-project-status
        with:
          token: ${{ secrets.PROJECT_MANAGEMENT_TOKEN }}
          issue-number: ${{ github.event.issue.number }}
          target-status: Research
          allowed-current-statuses: Inbox,Ready

  ready:
    if: github.event_name == 'issues' && github.event.action == 'labeled' && github.event.label.name == 'research-complete'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/set-drf-project-status
        with:
          token: ${{ secrets.PROJECT_MANAGEMENT_TOKEN }}
          issue-number: ${{ github.event.issue.number }}
          target-status: Ready
          allowed-current-statuses: Inbox,Research

  agent-executing:
    if: github.event_name == 'issues' && github.event.action == 'assigned' && (github.event.assignee.login == 'Codex' || github.event.assignee.login == 'copilot-swe-agent[bot]' || github.event.assignee.login == 'openai-code-agent[bot]' || github.event.assignee.login == 'anthropic-code-agent[bot]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/set-drf-project-status
        with:
          token: ${{ secrets.PROJECT_MANAGEMENT_TOKEN }}
          issue-number: ${{ github.event.issue.number }}
          target-status: Executing
          allowed-current-statuses: Inbox,Research,Ready

  executing:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Resolve Issue from branch
        id: issue
        env:
          REF_NAME: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$REF_NAME" =~ ^issue-([0-9]+)(-|$) ]] || { echo 'Not an Issue-linked branch.' >&2; exit 1; }
          echo "number=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/set-drf-project-status
        with:
          token: ${{ secrets.PROJECT_MANAGEMENT_TOKEN }}
          issue-number: ${{ steps.issue.outputs.number }}
          target-status: Executing
          allowed-current-statuses: Inbox,Research,Ready

  review:
    if: github.event_name == 'pull_request' && github.event.action != 'closed' && github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
      - name: Resolve governing Issue from PR
        id: issue
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        shell: bash
        run: |
          set -euo pipefail
          data="$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json closingIssuesReferences,body,headRefName)"
          issue="$(jq -r '.closingIssuesReferences[0].number // empty' <<<"$data")"
          if [ -z "$issue" ]; then
            body="$(jq -r '.body // ""' <<<"$data")"
            if [[ "$body" =~ (Refs|Fixes|Closes|Resolves)[[:space:]]+#([0-9]+) ]]; then issue="${BASH_REMATCH[2]}"; fi
          fi
          if [ -z "$issue" ]; then
            head="$(jq -r '.headRefName' <<<"$data")"
            if [[ "$head" =~ ^issue-([0-9]+)(-|$) ]]; then issue="${BASH_REMATCH[1]}"; fi
          fi
          test -n "$issue" || { echo 'No governing Issue could be resolved from PR.' >&2; exit 1; }
          echo "number=$issue" >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/set-drf-project-status
        with:
          token: ${{ secrets.PROJECT_MANAGEMENT_TOKEN }}
          issue-number: ${{ steps.issue.outputs.number }}
          target-status: Review
          allowed-current-statuses: Inbox,Research,Ready,Executing

  qa:
    if: github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
      - name: Resolve governing Issue from merged PR
        id: issue
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        shell: bash
        run: |
          set -euo pipefail
          data="$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json closingIssuesReferences,body,headRefName)"
          issue="$(jq -r '.closingIssuesReferences[0].number // empty' <<<"$data")"
          if [ -z "$issue" ]; then
            body="$(jq -r '.body // ""' <<<"$data")"
            if [[ "$body" =~ (Refs|Fixes|Closes|Resolves)[[:space:]]+#([0-9]+) ]]; then issue="${BASH_REMATCH[2]}"; fi
          fi
          if [ -z "$issue" ]; then
            head="$(jq -r '.headRefName' <<<"$data")"
            if [[ "$head" =~ ^issue-([0-9]+)(-|$) ]]; then issue="${BASH_REMATCH[1]}"; fi
          fi
          test -n "$issue" || { echo 'No governing Issue could be resolved from merged PR.' >&2; exit 1; }
          echo "number=$issue" >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/set-drf-project-status
        with:
          token: ${{ secrets.PROJECT_MANAGEMENT_TOKEN }}
          issue-number: ${{ steps.issue.outputs.number }}
          target-status: QA
          allowed-current-statuses: Executing,Review

  done:
    if: github.event_name == 'issues' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/set-drf-project-status
        with:
          token: ${{ secrets.PROJECT_MANAGEMENT_TOKEN }}
          issue-number: ${{ github.event.issue.number }}
          target-status: Done

  reopened:
    if: github.event_name == 'issues' && github.event.action == 'reopened'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/set-drf-project-status
        with:
          token: ${{ secrets.PROJECT_MANAGEMENT_TOKEN }}
          issue-number: ${{ github.event.issue.number }}
          target-status: Ready
