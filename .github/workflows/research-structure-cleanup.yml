name: Research structure cleanup

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/research-structure-cleanup.yml'

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rewrite moved research references
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = {
              'research/gohighlevel-ai-employee-usage-economics-2026-08-29.md': 'businesses/highlevel-vertical-saas-snapshot/research/gohighlevel-ai-employee-usage-economics-2026-08-29.md',
              'research/gohighlevel-recurring-revenue-opportunities-2026-08-29.md': 'businesses/highlevel-vertical-saas-snapshot/research/gohighlevel-recurring-revenue-opportunities-2026-08-29.md',
              'research/grok-bot-revenue-delivery-opportunity-2026-08-29.md': 'businesses/grok-bot-ai-revenue-operations/research/grok-bot-revenue-delivery-opportunity-2026-08-29.md',
              'research/niche-expansion-and-grok-bot-validation-2026-08-29.md': 'research/niches/_shared/niche-expansion-and-grok-bot-validation-2026-08-29.md',
              'research/whatsapp-crm-delivery-stack-cost-matrix-2026-08-29.md': 'businesses/whatsapp-crm-revenue-core/research/whatsapp-crm-delivery-stack-cost-matrix-2026-08-29.md',
              'research/whatsapp-crm-revenue-core-2026-08-29.md': 'businesses/whatsapp-crm-revenue-core/research/whatsapp-crm-revenue-core-2026-08-29.md',
              'research/whop-business-blueprints-productisation.md': 'businesses/whop-business-blueprints/research/whop-business-blueprints-productisation.md',
          }
          extensions = {'.md', '.html', '.json', '.yml', '.yaml', '.txt', '.js', '.ts', '.css'}
          changed = []
          for p in Path('.').rglob('*'):
              if not p.is_file() or '.git' in p.parts or p.suffix.lower() not in extensions:
                  continue
              text = p.read_text(encoding='utf-8')
              new = text
              for old, target in replacements.items():
                  new = new.replace(old, target)
              if new != text:
                  p.write_text(new, encoding='utf-8')
                  changed.append(str(p))

          Path('research/README.md').write_text('''# Research\n\nShared cross-portfolio research only.\n\n## Ownership rule\n\n- **Parent-offer research belongs with the offer:** `businesses/<offer>/RESEARCH.md` and, where supporting studies are needed, `businesses/<offer>/research/`.\n- **Niche research belongs under:** `research/niches/`.\n- **Root `research/` is reserved for genuinely reusable cross-portfolio studies** such as portfolio scoring, execution economics, market maps and cross-business opportunity analysis.\n- Do not keep a second flat copy of offer-owned or niche-owned research here. Move the file and update every reference instead.\n- Supporting historical/deep studies may remain separate from the canonical `RESEARCH.md`, but must live inside the owning offer or niche folder.\n\nThis structure keeps one obvious source location for every research asset.\n''', encoding='utf-8')

          print('Updated files:')
          for item in changed:
              print(item)
          PY
      - name: Verify old flat paths are absent
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          old_paths = [
            'research/gohighlevel-ai-employee-usage-economics-2026-08-29.md',
            'research/gohighlevel-recurring-revenue-opportunities-2026-08-29.md',
            'research/grok-bot-revenue-delivery-opportunity-2026-08-29.md',
            'research/niche-expansion-and-grok-bot-validation-2026-08-29.md',
            'research/whatsapp-crm-delivery-stack-cost-matrix-2026-08-29.md',
            'research/whatsapp-crm-revenue-core-2026-08-29.md',
            'research/whop-business-blueprints-productisation.md',
          ]
          existing = [p for p in old_paths if Path(p).exists()]
          if existing:
              raise SystemExit('Old flat files still exist: ' + ', '.join(existing))
          PY
      - name: Commit cleanup
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No changes required'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Repair research paths and enforce ownership rule'
          git push
